<body>
  <main aria-label="主内容区域" class="app">
    <header class="hero">
      <h1>主编的权柄</h1>
      <p>左滑扣留，右滑发布，观察公信力与流量如何变化。</p>
    </header>

    <section class="card"><details class="teach-card" open><summary>🎓 新闻编辑室的“发与不发”</summary><p>新闻编辑每天面临“发还是押”的决策：发布未经充分核实的暖新闻可获流量但损失公信力，压下新闻等待核实可能错过独家但保护声誉。本游戏模拟 20 个新闻线索，帮助你在公信力和流量之间找到平衡。</p></details></section>

    <section class="card">
      <div id="card" class="news-card"></div>
      <div class="actions">
        <button id="leftBtn" type="button">左滑（扣留）</button>
        <button id="rightBtn" type="button">右滑（发布）</button>
      </div>
      <p id="status" role="status" aria-live="polite">状态: 开始决策</p>
    </section>

    <section class="card">
      <p id="cred">公信力: <strong>50</strong></p>
      <p id="traffic">流量: <strong>50</strong></p>
    </section>

    <section class="card">
      <h2>📋 决策记录</h2>
      <div id="result" class="decision-history"></div>
    </section>
  </main>
  <script src="./pm-metrics.js" defer></script>
<script src="./app.js" defer></script>
