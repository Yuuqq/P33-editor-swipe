<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P33 主编的权柄（左滑右滑）</title>
  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="../shared/modern-styles.css" />
  <link rel="stylesheet" href="../shared/tool-chrome.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="主编的权柄。P33 主编的权柄（左滑右滑）" />
  <meta property="og:title" content="P33 主编的权柄左滑右滑" />
  <meta property="og:description" content="主编的权柄左滑右滑 — 前端纯静态新闻工具" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yuuqq.github.io/P33-editor-swipe/" />
  <link rel="manifest" href="./manifest.json" />
  <style media="print">
    .gnav, .pedagogy-panel, .explore-section, [class*="dark-toggle"], .gnav-fab, #darkToggleBtn {
      display: none !important;
    }
  </style>
</head>

<body>
  <main aria-label="主内容区域" class="app">
    <header class="tool-chrome" data-tool-id="P33">
      <a class="tool-chrome__mark" href="../P00-dashboard/">新闻实验工具</a>
      <span class="tool-chrome__id">P33</span>
    </header>

    <header class="hero">
      <h1>主编的权柄</h1>
      <p>左滑扣留，右滑发布，观察公信力与流量如何变化。</p>
    </header>

    <details class="tool-teach">
      <summary>如何使用</summary>
      <p>新闻编辑每天面临“发还是押”的决策：发布未经充分核实的暖新闻可获流量但损失公信力，压下新闻等待核实可能错过独家但保护声誉。本游戏模拟 20 个新闻线索，帮助你在公信力和流量之间找到平衡。</p>
    </details>

    <section class="deck" aria-label="选题决策">
      <div id="card" class="news-card"></div>
      <div class="actions">
        <button id="leftBtn" class="secondary" type="button">左滑（扣留）</button>
        <button id="rightBtn" type="button">右滑（发布）</button>
      </div>
      <p id="status" role="status" aria-live="polite">状态: 开始决策</p>
    </section>

    <section class="card">
      <p id="cred">公信力: <strong>50</strong></p>
      <p id="traffic">流量: <strong>50</strong></p>
    </section>

    <section class="card">
      <h2>决策记录</h2>
      <div id="result" class="decision-history"></div>
    </section>

    <footer class="tool-footer">
      数据边界以附录 A 为准：能在本机完成的计算不主动外发；示例数据仅供课堂；本工具输出不得单独当作结论。
      <a href="../P00-dashboard/">返回工具箱</a>
    </footer>
  </main>
  <script src="./pm-metrics.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="../shared/dark-toggle.js" defer></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
  <script src="../shared/cmd-palette.js" defer></script>
  <script src="../shared/toast.js" defer></script>
  <script src="../shared/onboarding.js" defer></script>
  <script src="../shared/pedagogy-data-p1.js" defer></script>
  <script src="../shared/pedagogy-data-p2.js" defer></script>
  <script src="../shared/global-nav.js" defer></script>
  <script src="../shared/kbd-hints.js" defer></script>
</body>
</html>
