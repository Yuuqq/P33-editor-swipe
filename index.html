<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P33 主编的权柄（左滑右滑）</title>
  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="主编的权柄。P33 主编的权柄（左滑右滑）" />
  <meta property="og:title" content="P33 主编的权柄左滑右滑" />
  <meta property="og:description" content="主编的权柄左滑右滑 — 前端纯静态新闻工具" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yuuqq.github.io/P33-editor-swipe/" />
</head>

<body>
  <main class="app">
    <header class="hero">
      <h1>主编的权柄</h1>
      <p>左滑扣留，右滑发布，观察公信力与流量如何变化。</p>
    </header>

    <section class="card">
      <div id="card" class="news-card"></div>
      <div class="actions">
        <button id="leftBtn" type="button">左滑（扣留）</button>
        <button id="rightBtn" type="button">右滑（发布）</button>
      </div>
      <p id="status" aria-live="polite">状态: 开始决策</p>
    </section>

    <section class="card">
      <p id="cred">公信力: <strong>50</strong></p>
      <p id="traffic">流量: <strong>50</strong></p>
    </section>

    <section class="card">
      <h2>📋 决策记录</h2>
      <div id="result" class="decision-history"></div>
    </section>
  </main>
  <script src="./pm-metrics.js" defer></script>
  <script src="./app.js" defer></script>

  <!-- Privacy Notice -->
  <div style="text-align:center;padding:12px 16px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:24px;">
    🔒 隐私提示：本工具所有数据处理均在您的浏览器本地完成，不会上传任何数据至服务器。
  </div>

  <!-- Cross-Project Navigation -->
  <nav
    style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;border-top:1px solid #e5e5e5;margin-top:16px;color:#666;">

    <span style="opacity:.4">P33</span>
  </nav>
</body>

</html>
